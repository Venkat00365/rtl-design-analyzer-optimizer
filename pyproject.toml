[project]
name = "rtl-design-analyzer-optimizer"
version = "1.0.0"
description = "Desktop app for static analysis, verified Boolean optimization, and graph visualization of a documented Verilog subset."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Venkat" }]

dependencies = [
    "PySide6==6.11.2",
    "networkx==3.7",
    "matplotlib==3.11.2",
    "sympy==1.14.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pyinstaller==6.11.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
